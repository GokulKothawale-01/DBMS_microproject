<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4f7fb">
    <title>Reports | Incident Nexus</title>
    <style>
        :root { color-scheme:light; --ink:#172238; --muted:#718096; --line:#e4eaf1; --surface:#fff; --canvas:#f4f7fb; --navy:#15243a; --blue:#2563eb; --blue-dark:#1d4ed8; --shadow:0 12px 34px rgba(29,48,77,.06); }
        * { box-sizing:border-box; } body { margin:0; background:var(--canvas); color:var(--ink); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } button,input,select,textarea { font:inherit; }
        .topbar { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 clamp(20px,5vw,72px); background:var(--surface); border-bottom:1px solid var(--line); }
        .brand { display:flex; align-items:center; gap:12px; color:var(--navy); font-size:15px; font-weight:750; } .brand-mark { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; color:#fff; background:var(--navy); } .brand-mark svg { width:21px; height:21px; }
        nav { display:flex; gap:5px; } nav a { padding:8px 10px; color:#64748b; border-radius:7px; text-decoration:none; font-size:13px; font-weight:650; } nav a:hover,nav a.active { color:var(--blue); background:#eff5ff; }
        main { width:min(1180px,calc(100% - 40px)); margin:0 auto; padding:38px 0 56px; } .heading { margin-bottom:25px; } .eyebrow { margin:0 0 7px; color:var(--blue); font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; } h1 { margin:0; color:var(--navy); font-size:clamp(27px,4vw,36px); line-height:1.15; letter-spacing:-.045em; } .subtitle { margin:9px 0 0; color:var(--muted); }
        .layout { display:grid; grid-template-columns:minmax(280px,.75fr) minmax(0,1.7fr); align-items:start; gap:20px; } .panel { min-width:0; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); } .panel-heading { padding:20px 22px 17px; border-bottom:1px solid var(--line); } .panel-heading h2 { margin:0; color:var(--navy); font-size:16px; } .panel-heading p { margin:4px 0 0; color:var(--muted); font-size:13px; }
        .form-body { padding:19px 22px 22px; } .field { margin-bottom:15px; } label { display:block; margin-bottom:6px; color:#34445a; font-size:12px; font-weight:700; } input,select,textarea { width:100%; min-height:41px; padding:9px 11px; color:var(--ink); background:#fff; border:1px solid #dce4ee; border-radius:8px; outline:none; } textarea { min-height:170px; resize:vertical; } input:focus,select:focus,textarea:focus { border-color:#7da6fa; box-shadow:0 0 0 3px rgba(37,99,235,.11); }
        .primary { width:100%; min-height:43px; padding:10px 14px; color:#fff; background:var(--blue); border:0; border-radius:8px; font-weight:700; cursor:pointer; } .primary:hover { background:var(--blue-dark); } .primary:disabled { cursor:wait; opacity:.7; } .message { margin:12px 0 0; font-size:13px; } .message:empty { display:none; } .success { color:#087a65; } .error { color:#c2413b; }
        .tools { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); } .tools input { max-width:420px; min-height:38px; font-size:13px; } .count { margin-left:auto; color:#52647c; font-size:12px; font-weight:700; }
        .report-list { display:grid; gap:0; } .report-card { padding:18px 20px; border-bottom:1px solid #edf1f5; } .report-card:last-child { border-bottom:0; } .report-meta { display:flex; align-items:center; flex-wrap:wrap; gap:8px 13px; margin-bottom:9px; color:#718096; font-size:12px; } .case-id { color:var(--blue); font-weight:750; } .report-text { margin:0; color:#34445a; white-space:pre-wrap; overflow-wrap:anywhere; }
        .delete-report { margin-left:auto; padding:5px 9px; color:#b42332; background:#fff; border:1px solid #f2cdd2; border-radius:7px; font-size:11px; font-weight:700; cursor:pointer; }
        .delete-report:hover { background:#fff2f3; }
        .empty { padding:32px 16px; color:var(--muted); text-align:center; }
        @media(max-width:850px) { .layout { grid-template-columns:1fr; } } @media(max-width:600px) { .topbar { min-height:60px; flex-wrap:wrap; gap:4px; padding:8px 12px; } .brand { gap:8px; font-size:13px; } .brand-mark { width:33px; height:33px; } nav { gap:0; } nav a { padding:6px; font-size:10px; } main { width:min(100% - 28px,1180px); padding-top:27px; } .panel-heading,.form-body { padding-left:16px; padding-right:16px; } .tools { padding:12px; } .report-card { padding:15px; } }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><path d="m14 2.8 9 5.2v10.3L14 23.5l-9-5.2V8l9-5.2Z" stroke="currentColor" stroke-width="1.7"/><circle cx="14" cy="13.2" r="2.3" fill="currentColor"/><circle cx="8.2" cy="9.6" r="1.35" fill="currentColor"/><circle cx="19.8" cy="9.6" r="1.35" fill="currentColor"/><circle cx="14" cy="19.7" r="1.35" fill="currentColor"/><path d="m12.1 11.9-2.8-1.7m6.6 1.7 2.8-1.7m-4.7 5.3v2.1" stroke="currentColor" stroke-width="1.4"/></svg></span><span>Incident Nexus</span></div>
        <nav aria-label="Main navigation"><a href="/">Home</a><a href="/incidents">Incidents</a><a href="/evidence">Evidence</a><a href="/investigators">Investigators</a><a class="active" href="/reports">Reports</a><button class="theme-toggle" type="button" data-theme-toggle>Dark mode</button></nav>
    </header>
    <main>
        <section class="heading"><p class="eyebrow">Case documentation</p><h1>Reports</h1><p class="subtitle">Write and review reports connected to reported incidents.</p></section>
        <div class="layout">
            <section class="panel" aria-labelledby="create-title">
                <div class="panel-heading"><h2 id="create-title">Create a report</h2><p>Select the incident this report documents.</p></div>
                <form class="form-body" id="reportForm">
                    <div class="field"><label for="case_id">Incident</label><select id="case_id" name="case_id" required disabled><option value="">Loading incidents...</option></select></div>
                    <div class="field"><label for="report_text">Report details</label><textarea id="report_text" name="report_text" placeholder="Enter findings, actions taken, and outcome..." required></textarea></div>
                    <button class="primary" id="submitButton" type="submit">Save report</button>
                    <p class="message" id="formMessage" role="status" aria-live="polite"></p>
                </form>
            </section>
            <section class="panel" aria-labelledby="list-title">
                <div class="panel-heading"><h2 id="list-title">Saved reports</h2><p>Reports are linked to their incident case ID.</p></div>
                <div class="tools"><input id="search" type="search" placeholder="Search case IDs and report text..." aria-label="Search reports"><span class="count" id="count">0 reports</span></div>
                <p class="message" id="listMessage" role="status" aria-live="polite" style="margin:12px 18px"></p>
                <div class="report-list" id="reportList"><div class="empty">Loading reports...</div></div>
            </section>
        </div>
    </main>
    <script>
        let incidents = [];
        let reports = [];
        const reportList = document.getElementById('reportList');
        const caseSelect = document.getElementById('case_id');
        function setIncidentOptions() {
            const previous = caseSelect.value;
            caseSelect.replaceChildren();
            const placeholder = document.createElement('option'); placeholder.value = ''; placeholder.textContent = incidents.length ? 'Choose an incident' : 'Register an incident first'; caseSelect.append(placeholder);
            incidents.forEach(incident => { const option = document.createElement('option'); option.value = incident.case_id; option.textContent = `${incident.case_id} · ${incident.incident_type}`; caseSelect.append(option); });
            caseSelect.disabled = incidents.length === 0;
            if (incidents.some(incident => incident.case_id === previous)) caseSelect.value = previous;
        }
        function renderReports() {
            const term = document.getElementById('search').value.trim().toLowerCase();
            const matches = reports.filter(report => `${report.case_id} ${report.incident_type} ${report.report_text}`.toLowerCase().includes(term));
            document.getElementById('count').textContent = `${matches.length} ${matches.length === 1 ? 'report' : 'reports'}`;
            reportList.replaceChildren();
            if (!matches.length) { const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = reports.length ? 'No matching reports.' : 'No reports saved yet.'; reportList.append(empty); return; }
            matches.forEach(report => {
                const article = document.createElement('article'); article.className = 'report-card';
                const meta = document.createElement('div'); meta.className = 'report-meta';
                const caseId = document.createElement('span'); caseId.className = 'case-id'; caseId.textContent = report.case_id;
                const type = document.createElement('span'); type.textContent = report.incident_type || 'Incident';
                const created = document.createElement('time'); created.textContent = report.created_at ? new Date(report.created_at).toLocaleString() : '';
                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'delete-report';
                deleteButton.textContent = 'Delete report';
                deleteButton.setAttribute('aria-label', `Delete report for case ${report.case_id}`);
                deleteButton.addEventListener('click', () => deleteReport(report.id));
                meta.append(caseId, type, created, deleteButton);
                const text = document.createElement('p'); text.className = 'report-text'; text.textContent = report.report_text;
                article.append(meta, text); reportList.append(article);
            });
        }
        async function loadData() {
            try {
                const [incidentResponse, reportResponse] = await Promise.all([fetch('/api/incidents'), fetch('/api/reports')]);
                const incidentData = await incidentResponse.json(); const reportData = await reportResponse.json();
                if (!incidentResponse.ok || !Array.isArray(incidentData)) throw new Error(incidentData.error || 'Unable to load incidents.');
                if (!reportResponse.ok || !Array.isArray(reportData)) throw new Error(reportData.error || 'Unable to load reports.');
                incidents = incidentData; reports = reportData; setIncidentOptions(); renderReports();
            } catch (error) { reportList.replaceChildren(); const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = error.message || 'Unable to load report data.'; reportList.append(empty); }
        }
        async function deleteReport(reportId) {
            if (!window.confirm('Delete this report? This action cannot be undone.')) return;
            const message = document.getElementById('listMessage');
            message.textContent = '';
            message.className = 'message';
            try {
                const response = await fetch(`/api/reports/${encodeURIComponent(reportId)}`, { method: 'DELETE' });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Unable to delete this report.');
                message.textContent = result.message || 'Report deleted.';
                message.classList.add('success');
                await loadData();
            } catch (error) {
                message.textContent = error.message || 'Unable to delete this report.';
                message.classList.add('error');
            }
        }
        document.getElementById('search').addEventListener('input', renderReports);
        document.getElementById('reportForm').addEventListener('submit', async event => {
            event.preventDefault(); const form = event.currentTarget; const button = document.getElementById('submitButton'); const message = document.getElementById('formMessage'); button.disabled = true; button.textContent = 'Saving...'; message.textContent = ''; message.className = 'message';
            try { const payload = Object.fromEntries(new FormData(form).entries()); const response = await fetch('/api/reports', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }); const result = await response.json(); if (!response.ok) throw new Error(result.error || 'Unable to save report.'); form.reset(); message.textContent = result.message; message.classList.add('success'); await loadData(); }
            catch (error) { message.textContent = error.message; message.classList.add('error'); } finally { button.disabled = false; button.textContent = 'Save report'; }
        });
        loadData();
    </script>
</body>
</html>
